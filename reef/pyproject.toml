[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
# Reef, the tool aggregator: Trellis enforced at the door of your MCP servers.
name = "reef-mcp"
version = "0.1.1"
description = "A grant-shaped MCP gateway: agents see and call only what their Trellis grant allows."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Trellis contributors" }]
keywords = ["mcp", "ai-agents", "gateway", "access-control", "audit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    # 0.1.1: the public names Reef imports (tests/test_reef_surface.py in trellisd).
    "trellisd>=0.1.1,<0.2",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
    "anyio>=4",
]

[project.scripts]
reef = "reef.cli:main"

[project.urls]
Homepage = "https://github.com/FatherBrian/trellis/tree/main/reef"
Issues = "https://github.com/FatherBrian/trellis/issues"

[tool.uv.sources]
trellisd = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/reef"]

[tool.hatch.build.targets.wheel.force-include]
# The demo config ships inside the wheel so `reef demo the-door` works after `pip install`.
"examples/the-door" = "reef/_examples/the-door"
