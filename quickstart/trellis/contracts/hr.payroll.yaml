# Payroll: confidential, and salary is pii. Ana covers HR reporting this quarter, so the
# contract lets her read it with salaries masked. Whether report-bot may read it for her
# is up to the grant she gives it.
contract: urn:contract:hr.payroll
version: 1
kind: mcp_tool
bindings: [mcp://hr/payroll]
owner: hr-lead@example.com
tags: [hr, confidential]
elements:
  employee: []
  region: []
  salary: [pii]
access:
  partners:
    who: [group:hr-partners]
    actions: [read]
  reporting:
    who: [user:ana@example.com]
    actions: [read]
    mask: [pii]
