# The general ledger: the table, and the tool that posts adjustments. The contract doesn't
# say approver_email is pii; the catalog does, and a catalog can add tags, never remove them.
contract: urn:contract:finance.gl
version: 3
kind: table
description: Posted journal entries, and the tool that posts adjustments.
bindings:
  - finance.gl.journal_entries
  - mcp://ledger/post_adjustment
owner: finance-owner@example.com
tags: [finance, internal]
elements:
  entry_id: []
  amount: []
  region: []
  approver_email: []
access:
  analysts:
    who: [group:finance-analysts]
    actions: [read, query]
    mask: [pii]
  controllers:
    who: [group:finance-controllers]
    actions: [read, query, write]
rows:
  - "region = {person.region}"
