services:
  moat:
    build: .
    command: ["moat", "serve", "--host", "0.0.0.0", "--port", "8181"]
    environment:
      MOAT_LEDGER: /data/moat-ledger.db
    volumes:
      - ./examples:/etc/moat:ro
      - moat-data:/data
