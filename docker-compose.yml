# Trellis demo. Placeholder: the services below are sketched for week 3 and do not run yet.
#   docker compose up
services:
  trellis:
    build: .
    command: ["trellisd", "serve", "--host", "0.0.0.0", "--port", "8181"]
    environment:
      TRELLIS_LEDGER: /data/trellisd-ledger.db
    volumes:
      - ./examples:/etc/trellis:ro
      - trellis-data:/data
    ports:
      - "8181:8181"

