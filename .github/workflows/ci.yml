name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis
          POSTGRES_DB: trellis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trellis" --health-interval 2s --health-retries 15
    env:
      TRELLISD_TEST_POSTGRES: postgresql://trellis:trellis@localhost:5432/trellis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Demos
        run: |
          uv run trellisd demo three-keys
          uv run trellisd demo who-allowed-this
          uv run trellisd demo catalog-says-pii
          uv run trellisd demo bring-your-own-idp
