name: Release

# Push a tag like v0.1.0 to publish trellisd and reef-mcp to PyPI.
# Publishing uses PyPI trusted publishing (OIDC): no API tokens are stored anywhere.
# Each PyPI project trusts this repo, this workflow (release.yml) and the "pypi" environment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Check the tag matches both package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, re, sys, tomllib
          tag = os.environ["TAG"]
          want = tag[1:] if tag.startswith("v") else tag
          found = {}
          for path in ("pyproject.toml", "reef/pyproject.toml"):
              with open(path, "rb") as f:
                  project = tomllib.load(f)["project"]
              found[project["name"]] = project["version"]
          init = open("src/trellisd/__init__.py").read()
          m = re.search(r'^__version__ = "([^"]+)"', init, re.M)
          found["trellisd.__version__"] = m.group(1) if m else "missing"
          bad = {k: v for k, v in found.items() if v != want}
          if bad:
              for k, v in bad.items():
                  print(f"::error::{k} is {v}, but the tag {tag} says {want}")
              sys.exit(1)
          print(f"Tag {tag} matches: {found}")
          EOF
      - name: Build trellisd
        run: python -m build --outdir dist/ .
      - name: Build reef-mcp
        run: python -m build --outdir dist/ reef
      - name: Check the distributions
        run: |
          ls -l dist/
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trellisd/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Both projects trust this repo, release.yml and the pypi environment, so one token
      # covers both. Attestations are on (the action's default): PyPI shows each file was
      # built here. skip-existing lets a re-run finish a partial upload.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
