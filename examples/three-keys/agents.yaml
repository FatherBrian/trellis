# Each agent's owner sets its ceiling: the most it may ever touch, whoever it works for.
agents:
  report-bot:
    owner: ana@example.com
    description: Drafts finance reports.
    ceiling:
      actions: [read, query]
      tags: [finance, pii, hr]
      never: [export_controlled]
  inspector-bot:
    owner: quality-lead@example.com
    description: Reviews one inspection record when it is filed.
    ceiling:
      actions: [read]
      tags: [quality]
