# The general ledger's contract, written by its owner. The source of truth for what the
# table is and who may read it; a catalog can add tags to it, never take them away.
contract: urn:contract:finance.gl
version: 3
kind: table
description: Posted journal entries, one row per line.
bindings:
  - finance.gl.journal_entries
  - mcp://ledger/journal_entries
owner: finance-owner@example.com
steward: finance-steward@example.com
tags: [finance, internal]
elements:
  entry_id: []
  amount: []
  region: []
  approver_email: []
purposes: [financial_close]
access:
  analysts:
    who: [group:finance-analysts]
    actions: [read, query]
    mask: [pii]
rows:
  - "region = {person.region}"
